# Schulcloud Exporter -- local archive in Docker.
#
#   cp .env.example .env   # fill in credentials if you want imports without the dialog
#   docker compose up -d --build
#   open http://127.0.0.1:4317
#
# One-off jobs go through the same image and the same volume:
#
#   docker compose run --rm archive node src/cli.mjs export
#   docker compose run --rm archive node src/cli.mjs repair
name: schulcloud-archive

services:
  archive:
    build:
      context: .
    image: schulcloud-archive:local
    # Published on the host's loopback interface only -- the archive holds other
    # people's messages, and nothing here is authenticated. The API accepts an
    # import only when the Host header is 127.0.0.1/localhost, so reaching it
    # under a LAN name still shows the chats but refuses imports.
    # Use SCHULCLOUD_BIND=0.0.0.0 only on a network you trust.
    ports:
      - "${SCHULCLOUD_BIND:-127.0.0.1}:${SCHULCLOUD_PORT:-4317}:4317"
    environment:
      SCHULCLOUD_ARCHIVE_DIR: /data
      # Optional: where attachments and avatars live. "file" keeps them in the
      # volume below, "s3" puts them in a bucket. Unset means the disk, which is
      # also what the settings page in the viewer defaults to. Everything set
      # here overrides what the settings page saves.
      SCHULCLOUD_STORAGE: "${SCHULCLOUD_STORAGE:-}"
      # S3-compatible storage: AWS, MinIO, Wasabi, Backblaze B2, Cloudflare R2,
      # Hetzner. `docker inspect` shows whatever ends up here, and so does
      # anyone who can read this compose file -- treat it like a password.
      SCHULCLOUD_S3_ENDPOINT: "${SCHULCLOUD_S3_ENDPOINT:-}"
      SCHULCLOUD_S3_REGION: "${SCHULCLOUD_S3_REGION:-}"
      SCHULCLOUD_S3_BUCKET: "${SCHULCLOUD_S3_BUCKET:-}"
      SCHULCLOUD_S3_ACCESS_KEY_ID: "${SCHULCLOUD_S3_ACCESS_KEY_ID:-}"
      SCHULCLOUD_S3_SECRET_ACCESS_KEY: "${SCHULCLOUD_S3_SECRET_ACCESS_KEY:-}"
      # Key prefix, so several archives can share one bucket.
      SCHULCLOUD_S3_PREFIX: "${SCHULCLOUD_S3_PREFIX:-}"
      # Path-style URLs: required by MinIO and friends, wrong for AWS.
      SCHULCLOUD_S3_PATH_STYLE: "${SCHULCLOUD_S3_PATH_STYLE:-}"
      # Optional. When all three are set, an import started from the viewer
      # needs no password in the browser. Leave them empty to type them into
      # the dialog instead; they are never written to the database or disk.
      # Note that `docker inspect` shows whatever ends up here.
      SCHULCLOUD_EMAIL: "${SCHULCLOUD_EMAIL:-}"
      SCHULCLOUD_PASSWORD: "${SCHULCLOUD_PASSWORD:-}"
      SCHULCLOUD_SECURITY_PASSWORD: "${SCHULCLOUD_SECURITY_PASSWORD:-}"
    volumes:
      # The SQLite database, the blobs and the JSON export all live here.
      # Back this up, do not just copy the .sqlite file.
      - archive-data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  archive-data: