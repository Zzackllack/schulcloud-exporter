<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Schulcloud Archiv">
  <!-- Mirrors .brand-mark in web/style.css: a 17/53 rounded square in #d9f3f5
       carrying the lucide "cloud" glyph in #17536c. The stroke is nudged from
       the UI's 2.1 to 2.5 in icon units so it still reads at 16px in a tab. -->
  <rect width="64" height="64" rx="20" fill="#d9f3f5" />
  <g transform="translate(15.2 15.2) scale(1.4)">
    <path
      d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"
      fill="none"
      stroke="#17536c"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
